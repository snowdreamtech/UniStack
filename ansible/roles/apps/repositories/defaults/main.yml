---
# defaults/main.yml for apps/repositories

repo_crb_name: >-
  {%- if (os_distribution | default('') in ['oraclelinux', 'ol']) or (os_distribution_id | default('') in ['oraclelinux', 'ol']) -%}
    ol{{ os_version_major | default('9', true) }}_codeready_builder
  {%- elif (os_distribution | default('') in ['rhel', 'ubi']) or (os_distribution_id | default('') in ['rhel', 'ubi']) -%}
    codeready-builder-for-rhel-{{ os_version_major | default('9', true) }}-x86_64-rpms
  {%- elif os_version_major | default('0', true) | int >= 9 -%}
    crb
  {%- elif (os_distribution | default('') in ['rocky', 'almalinux', 'centos']) or (os_distribution_id | default('') in ['rocky', 'almalinux', 'centos']) -%}
    powertools
  {%- else -%}
    PowerTools
  {%- endif -%}

repo_epel_name: >-
  {%- if (os_distribution | default('') in ['oraclelinux', 'ol', 'rhel', 'ubi']) or (os_distribution_id | default('') in ['oraclelinux', 'ol', 'rhel', 'ubi']) -%}
    https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ os_version_major | default('9', true) }}.noarch.rpm
  {%- else -%}
    epel-release
  {%- endif -%}
