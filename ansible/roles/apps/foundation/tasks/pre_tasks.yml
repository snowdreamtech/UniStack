---
# =====================================================================
# roles/apps/foundation/tasks/pre_tasks.yml
#
# Purpose:
#   Configure system mirrors and repositories before base packages are
#   installed by the native engine.
# =====================================================================

- name: "Foundation: Configure Mirror"
  ansible.builtin.include_role:
    name: "apps/mirror"
  when: init_mirror_enabled | default(false, true)

- name: "Foundation: Configure Repositories"
  ansible.builtin.include_role:
    name: "apps/repositories"
