- name: Test Foundation Application Lifecycle
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    # Minimal configuration needed for testing foundation module
    unistack_user_name: "testuser"
    unistack_user_group: "testgroup"
    init_mirror_enabled: false
  tasks:
    - name: Set fake OS facts
      ansible.builtin.set_fact:
        os_family: "debian"
        os_distribution_id: "ubuntu"
        os_version_major: "24"
        os_architecture: "amd64"
        ansible_pkg_mgr: "apt"

    - name: Load core
      ansible.builtin.include_role:
        name: "core"
        tasks_from: "main.yml"
      ignore_errors: true

    - name: Dispatch Foundation
      ansible.builtin.include_role:
        name: "app"
      vars:
        app_name: "foundation"
